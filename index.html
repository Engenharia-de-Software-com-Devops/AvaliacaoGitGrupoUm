<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo List</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
    label, input, select, textarea, button { display: block; width: 100%; box-sizing: border-box; }
    input, select, textarea, button { margin: .5rem 0 1rem; padding: .7rem; font: inherit; }
    textarea { min-height: 5rem; resize: vertical; }
    #error, .field-error, #task-error { color: #a00; }
    .field-error { display: block; margin: -.7rem 0 1rem; font-size: .9rem; }
    .invalid { border: 2px solid #a00; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > div { flex: 1 1 12rem; }
    .inline { display: flex; gap: .5rem; align-items: end; }
    .inline input { flex: 1; margin-bottom: 0; }
    .inline button { width: auto; margin-bottom: 0; }
    .secondary { background: #eee; border: 1px solid #ccc; }
    #task-message { color: #060; }
    fieldset { border: 1px solid #ddd; padding: 1rem; margin: 0 0 1.5rem; }
    /* Keep the hidden attribute effective on elements styled with display above. */
    [hidden] { display: none !important; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin: .5rem 0 1rem; }
    th, td { border-bottom: 1px solid #ddd; padding: .45rem .4rem; text-align: left; vertical-align: middle; }
    th button.sort { display: inline; width: auto; margin: 0; padding: 0; border: 0; background: none; font-weight: bold; cursor: pointer; }
    td button, .pager button, #delete-selected { display: inline-block; width: auto; margin: 0; padding: .3rem .7rem; }
    input[type="checkbox"] { display: inline; width: auto; margin: 0; }
    tr.selected { background: #fff7d6; }
    .pager { display: flex; gap: .7rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1rem; }
    .danger { background: #a00; color: #fff; border: 1px solid #800; }
    .danger:disabled { opacity: .5; }
    #list-message { color: #060; }
    #list-error { color: #a00; }
    .actions { display: flex; gap: .7rem; flex-wrap: wrap; }
    #export-csv { display: inline-block; width: auto; margin: 0; padding: .3rem .7rem; }
    .hint { color: #555; font-size: .9rem; }
    #dashboard { margin-top: 2rem; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
    .chart { border: 1px solid #ddd; border-radius: .4rem; padding: 1rem; margin: 0; }
    .chart h3 { margin: 0 0 .8rem; font-size: 1rem; }
    .donut { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .donut svg { width: 8rem; height: 8rem; flex: none; }
    .legend { list-style: none; margin: 0; padding: 0; font-size: .9rem; }
    .legend li { display: flex; align-items: center; gap: .4rem; margin: .25rem 0; }
    .swatch { width: .8rem; height: .8rem; border-radius: .15rem; flex: none; }
    .columns { display: flex; align-items: flex-end; gap: .8rem; height: 9rem; border-bottom: 1px solid #999; }
    .column { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .column .bar { width: 100%; max-width: 3rem; border-radius: .2rem .2rem 0 0; min-height: 1px; }
    .column .value { font-weight: bold; font-size: .9rem; margin-bottom: .2rem; }
    .column-labels { display: flex; gap: .8rem; font-size: .85rem; }
    .column-labels span { flex: 1; text-align: center; }
    .hbar { display: grid; grid-template-columns: 6.5rem 1fr 2rem; align-items: center; gap: .4rem; margin: .3rem 0; font-size: .9rem; }
    .hbar .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar .track { background: #eee; border-radius: .2rem; height: .9rem; }
    .hbar .bar { background: #3b6fb6; height: 100%; border-radius: .2rem; min-width: 1px; }
    .hbar .value { text-align: right; font-weight: bold; }
    #dashboard-error { color: #a00; }
  </style>
</head>
<body>
  <main>
    <h1>ToDo List</h1>
    <form id="login">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p id="error" role="alert"></p>
    </form>
    <p id="welcome" hidden></p>

    <section id="tasks" hidden>
      <fieldset>
        <legend>Editar tarefa existente</legend>
        <form id="load-task" class="inline">
          <div style="flex:1">
            <label for="load-id">ID da tarefa</label>
            <input id="load-id" type="number" min="1" step="1" required>
          </div>
          <button type="submit">Carregar</button>
        </form>
      </fieldset>

      <h2 id="task-heading">Nova tarefa</h2>
      <form id="task-form" novalidate>
        <label for="title">Título *</label>
        <input id="title" name="title" maxlength="100" required>
        <small class="field-error" data-for="title"></small>

        <label for="description">Descrição</label>
        <textarea id="description" name="description" maxlength="500"></textarea>
        <small class="field-error" data-for="description"></small>

        <div class="row">
          <div>
            <label for="priority">Prioridade *</label>
            <select id="priority" name="priority" required>
              <option value="">Selecione</option>
              <option value="low">Baixa</option>
              <option value="medium">Média</option>
              <option value="high">Alta</option>
            </select>
            <small class="field-error" data-for="priority"></small>
          </div>
          <div>
            <label for="status">Situação *</label>
            <select id="status" name="status" required>
              <option value="pending">Pendente</option>
              <option value="in_progress">Em andamento</option>
              <option value="done">Concluída</option>
            </select>
            <small class="field-error" data-for="status"></small>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="due_date">Data de entrega *</label>
            <input id="due_date" name="due_date" type="date" required>
            <small class="field-error" data-for="due_date"></small>
          </div>
          <div>
            <label for="category">Categoria *</label>
            <input id="category" name="category" maxlength="50" required>
            <small class="field-error" data-for="category"></small>
          </div>
        </div>

        <button type="submit" id="task-submit">Cadastrar tarefa</button>
        <button type="button" id="task-cancel" class="secondary" hidden>Cancelar edição</button>
        <p id="task-error" role="alert"></p>
        <p id="task-message" role="status"></p>
      </form>

      <h2>Tarefas</h2>
      <form id="search-form">
        <fieldset>
          <legend>Busca avançada</legend>
          <label for="search-title">Título contém</label>
          <input id="search-title" name="title" maxlength="100">
          <div class="row">
            <div>
              <label for="search-priority">Prioridade</label>
              <select id="search-priority" name="priority">
                <option value="">Todas</option>
                <option value="low">Baixa</option>
                <option value="medium">Média</option>
                <option value="high">Alta</option>
              </select>
            </div>
            <div>
              <label for="search-status">Situação</label>
              <select id="search-status" name="status">
                <option value="">Todas</option>
                <option value="pending">Pendente</option>
                <option value="in_progress">Em andamento</option>
                <option value="done">Concluída</option>
              </select>
            </div>
          </div>
          <button type="submit">Buscar</button>
          <button type="button" id="clear-search" class="secondary">Limpar filtros</button>
        </fieldset>
      </form>
      <p id="list-error" role="alert"></p>
      <p id="list-message" role="status"></p>
      <div class="table-wrap">
        <table id="task-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="select-all" aria-label="Selecionar todas as tarefas da página"></th>
              <th data-sort="title"><button type="button" class="sort" data-sort="title">Título</button></th>
              <th data-sort="priority"><button type="button" class="sort" data-sort="priority">Prioridade</button></th>
              <th data-sort="status"><button type="button" class="sort" data-sort="status">Situação</button></th>
              <th data-sort="due_date"><button type="button" class="sort" data-sort="due_date">Data de entrega</button></th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="task-rows"></tbody>
        </table>
      </div>
      <div class="pager">
        <button type="button" id="prev-page">Anterior</button>
        <span id="page-info"></span>
        <button type="button" id="next-page">Próxima</button>
      </div>
      <div class="actions">
        <button type="button" id="delete-selected" class="danger" disabled>Excluir selecionadas</button>
        <button type="button" id="export-csv">Exportar CSV</button>
      </div>
      <p id="export-hint" class="hint">O CSV inclui todas as tarefas da busca ativa (ou todas, sem filtros), não só a página exibida.</p>

      <section id="dashboard" aria-labelledby="dashboard-heading">
        <h2 id="dashboard-heading">Dashboard</h2>
        <p id="dashboard-total" class="hint"></p>
        <p id="dashboard-error" role="alert"></p>
        <div class="charts">
          <figure class="chart" id="chart-status">
            <h3>Tarefas por situação</h3>
            <div class="donut"></div>
          </figure>
          <figure class="chart" id="chart-priority">
            <h3>Tarefas por prioridade</h3>
            <div class="columns"></div>
            <div class="column-labels"></div>
          </figure>
          <figure class="chart" id="chart-category">
            <h3>Tarefas por categoria</h3>
            <div class="hbars"></div>
          </figure>
        </div>
      </section>
    </section>
  </main>
  <script>
    const form = document.getElementById('login');
    const error = document.getElementById('error');
    const welcome = document.getElementById('welcome');
    const tasksSection = document.getElementById('tasks');
    const taskForm = document.getElementById('task-form');
    const taskError = document.getElementById('task-error');
    const taskMessage = document.getElementById('task-message');
    const fields = ['title', 'description', 'priority', 'status', 'due_date', 'category'];
    const listError = document.getElementById('list-error');
    const listMessage = document.getElementById('list-message');
    const priorityLabels = { low: 'Baixa', medium: 'Média', high: 'Alta' };
    const statusLabels = { pending: 'Pendente', in_progress: 'Em andamento', done: 'Concluída' };
    // Listing state includes the last submitted filters, page and ordering.
    const listState = { page: 1, sort: 'id', order: 'asc', totalPages: 0, filters: null };
    const selected = new Set();
    let editingId = null;
    let listRequest = 0;

    async function showSession() {
      const response = await fetch('/api/web/session');
      if (!response.ok) return;
      const user = await response.json();
      welcome.textContent = `Bem-vindo, ${user.username}!`;
      welcome.hidden = false;
      form.hidden = true;
      tasksSection.hidden = false;
      await Promise.all([loadList(), loadDashboard()]);
    }

    // Dashboard: three charts drawn with plain HTML/SVG from GET /api/web/dashboard.
    const statusColors = { pending: '#d98c1f', in_progress: '#3b6fb6', done: '#2e8b57' };
    const priorityColors = { low: '#7aa874', medium: '#d9a21f', high: '#c0392b' };
    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function percent(count, total) {
      return total ? Math.round((count / total) * 100) : 0;
    }
    function drawDonut(container, items, total) {
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 42 42');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', items.map((item) => `${statusLabels[item.key]}: ${item.count}`).join(', '));
      const ring = (color, length, offset) => {
        const circle = document.createElementNS(svgNS, 'circle');
        for (const [name, value] of Object.entries({ cx: 21, cy: 21, r: 15.915, fill: 'none', stroke: color, 'stroke-width': 6 })) circle.setAttribute(name, value);
        // A circumference of 100 makes each dash length equal to its percentage.
        circle.setAttribute('stroke-dasharray', `${length} ${100 - length}`);
        circle.setAttribute('stroke-dashoffset', 25 - offset);
        return circle;
      };
      svg.append(ring('#eee', 100, 0));
      let offset = 0;
      for (const item of items) {
        if (!item.count) continue;
        const length = (item.count / total) * 100;
        svg.append(ring(statusColors[item.key], length, offset));
        offset += length;
      }
      const label = document.createElementNS(svgNS, 'text');
      for (const [name, value] of Object.entries({ x: 21, y: 23.5, 'text-anchor': 'middle', 'font-size': 7, 'font-weight': 'bold' })) label.setAttribute(name, value);
      label.textContent = total;
      svg.append(label);
      const legend = element('ul', 'legend');
      for (const item of items) {
        const li = element('li');
        const swatch = element('span', 'swatch');
        swatch.style.background = statusColors[item.key];
        li.append(swatch, `${statusLabels[item.key]}: ${item.count} (${percent(item.count, total)}%)`);
        legend.append(li);
      }
      container.replaceChildren(svg, legend);
    }
    function drawColumns(chart, items) {
      const max = Math.max(1, ...items.map((item) => item.count));
      chart.querySelector('.columns').replaceChildren(...items.map((item) => {
        const column = element('div', 'column');
        column.setAttribute('aria-label', `${priorityLabels[item.key]}: ${item.count}`);
        const bar = element('div', 'bar');
        bar.style.height = `${(item.count / max) * 85}%`;
        bar.style.background = priorityColors[item.key];
        column.append(element('span', 'value', item.count), bar);
        return column;
      }));
      chart.querySelector('.column-labels').replaceChildren(...items.map((item) => element('span', '', priorityLabels[item.key])));
    }
    function drawHorizontalBars(container, items) {
      if (!items.length) {
        container.replaceChildren(element('p', 'hint', 'Nenhuma categoria cadastrada.'));
        return;
      }
      const max = Math.max(...items.map((item) => item.count));
      container.replaceChildren(...items.map((item) => {
        const row = element('div', 'hbar');
        const label = element('span', 'label', item.key);
        label.title = item.key;
        const track = element('div', 'track');
        const bar = element('div', 'bar');
        bar.style.width = `${(item.count / max) * 100}%`;
        track.append(bar);
        row.append(label, track, element('span', 'value', item.count));
        return row;
      }));
    }
    async function loadDashboard() {
      const dashboardError = document.getElementById('dashboard-error');
      dashboardError.textContent = '';
      try {
        const response = await fetch('/api/web/dashboard');
        if (response.status === 401) { dashboardError.textContent = 'Sessão expirada. Recarregue a página e entre novamente.'; return; }
        if (!response.ok) { dashboardError.textContent = 'Não foi possível carregar os indicadores.'; return; }
        const data = await response.json();
        document.getElementById('dashboard-total').textContent = `${data.total} tarefa(s) no total. Os valores vêm do banco e são atualizados ao recarregar a página ou alterar tarefas.`;
        drawDonut(document.querySelector('#chart-status .donut'), data.by_status, data.total);
        drawColumns(document.getElementById('chart-priority'), data.by_priority);
        drawHorizontalBars(document.querySelector('#chart-category .hbars'), data.by_category);
      } catch (_) { dashboardError.textContent = 'Não foi possível conectar ao servidor.'; }
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      try {
        const response = await fetch('/api/web/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        document.getElementById('password').value = '';
        if (!response.ok) { error.textContent = 'Não foi possível entrar. Verifique suas credenciais.'; return; }
        await showSession();
      } catch (_) { error.textContent = 'Não foi possível conectar ao servidor.'; }
    });

    // Client-side checks mirror the API rules; the API validates again.
    function validate(task) {
      const problems = {};
      const length = (value) => [...value].length;
      if (length(task.title) < 3 || length(task.title) > 100) problems.title = 'Informe um título com 3 a 100 caracteres.';
      if (length(task.description) > 500) problems.description = 'A descrição deve ter no máximo 500 caracteres.';
      if (!['low', 'medium', 'high'].includes(task.priority)) problems.priority = 'Escolha a prioridade: baixa, média ou alta.';
      if (!['pending', 'in_progress', 'done'].includes(task.status)) problems.status = 'Escolha a situação: pendente, em andamento ou concluída.';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(task.due_date)) problems.due_date = 'Informe uma data de entrega válida (AAAA-MM-DD).';
      if (length(task.category) < 2 || length(task.category) > 50) problems.category = 'Informe uma categoria com 2 a 50 caracteres.';
      return problems;
    }
    function showProblems(problems) {
      for (const field of fields) {
        const message = problems[field] || '';
        document.querySelector(`.field-error[data-for="${field}"]`).textContent = message;
        document.getElementById(field).classList.toggle('invalid', message !== '');
      }
    }
    function readTask() {
      return Object.fromEntries(fields.map((field) => [field, document.getElementById(field).value.trim()]));
    }
    function fillTask(task) {
      for (const field of fields) document.getElementById(field).value = task[field] ?? '';
    }
    function setMode(id) {
      editingId = id;
      document.getElementById('task-heading').textContent = id ? `Editando tarefa #${id}` : 'Nova tarefa';
      document.getElementById('task-submit').textContent = id ? 'Salvar alterações' : 'Cadastrar tarefa';
      document.getElementById('task-cancel').hidden = !id;
    }
    function resetForm() {
      taskForm.reset();
      showProblems({});
      setMode(null);
    }
    function formatDate(value) {
      const [year, month, day] = value.split('-');
      return `${day}/${month}/${year}`;
    }
    function cell(text) {
      const td = document.createElement('td');
      td.textContent = text;
      return td;
    }
    function updateSelectionControls() {
      const boxes = [...document.querySelectorAll('#task-rows input[type="checkbox"]')];
      document.getElementById('select-all').checked = boxes.length > 0 && boxes.every((box) => box.checked);
      const button = document.getElementById('delete-selected');
      button.disabled = selected.size === 0;
      button.textContent = selected.size ? `Excluir selecionadas (${selected.size})` : 'Excluir selecionadas';
    }
    function renderList(page) {
      selected.clear();
      listState.totalPages = page.total_pages;
      const rows = page.items.map((item) => {
        const tr = document.createElement('tr');
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.setAttribute('aria-label', `Selecionar tarefa #${item.id}`);
        check.addEventListener('change', () => {
          if (check.checked) selected.add(item.id); else selected.delete(item.id);
          tr.classList.toggle('selected', check.checked);
          updateSelectionControls();
        });
        const selectCell = document.createElement('td');
        selectCell.append(check);
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'Editar';
        edit.addEventListener('click', () => loadTask(item.id));
        const actions = document.createElement('td');
        actions.append(edit);
        tr.append(selectCell, cell(item.title), cell(priorityLabels[item.priority] || item.priority),
          cell(statusLabels[item.status] || item.status), cell(formatDate(item.due_date)), actions);
        return tr;
      });
      if (!rows.length) {
        const tr = document.createElement('tr');
        const td = cell(listState.filters ? 'Nenhuma tarefa encontrada para os filtros.' : 'Nenhuma tarefa cadastrada.');
        td.colSpan = 6;
        tr.append(td);
        rows.push(tr);
      }
      document.getElementById('task-rows').replaceChildren(...rows);
      const pages = Math.max(page.total_pages, 1);
      document.getElementById('page-info').textContent = `Página ${page.page} de ${pages} — ${page.total} tarefa(s)`;
      document.getElementById('prev-page').disabled = page.page <= 1;
      document.getElementById('next-page').disabled = page.page >= pages;
      for (const th of document.querySelectorAll('th[data-sort]')) {
        const active = th.dataset.sort === listState.sort;
        th.setAttribute('aria-sort', active ? (listState.order === 'asc' ? 'ascending' : 'descending') : 'none');
        const button = th.querySelector('button');
        button.textContent = button.textContent.replace(/ [▲▼]$/, '') + (active ? (listState.order === 'asc' ? ' ▲' : ' ▼') : '');
      }
      updateSelectionControls();
    }
    // Loads the current listing or filtered page, ignoring stale responses.
    async function loadList() {
      listError.textContent = '';
      const requestId = ++listRequest;
      const params = new URLSearchParams({ page: listState.page, sort: listState.sort, order: listState.order });
      if (listState.filters) {
        for (const [key, value] of Object.entries(listState.filters)) if (value) params.set(key, value);
      }
      try {
        const endpoint = listState.filters ? '/api/web/records/search' : '/api/web/records';
        const response = await fetch(`${endpoint}?${params}`);
        if (requestId !== listRequest) return;
        if (response.status === 401) { listError.textContent = 'Sessão expirada. Recarregue a página e entre novamente.'; return; }
        if (!response.ok) { listError.textContent = 'Não foi possível carregar as tarefas.'; return; }
        const page = await response.json();
        if (requestId !== listRequest) return;
        // After deletions the current page may no longer exist: go to the last one.
        if (!page.items.length && listState.page > 1 && page.total_pages > 0) {
          listState.page = page.total_pages;
          return loadList();
        }
        renderList(page);
      } catch (_) { if (requestId === listRequest) listError.textContent = 'Não foi possível conectar ao servidor.'; }
    }
    async function deleteSelected() {
      const ids = [...selected];
      if (!ids.length || !confirm(`Excluir ${ids.length} tarefa(s) selecionada(s)? Esta ação não pode ser desfeita.`)) return;
      listError.textContent = '';
      listMessage.textContent = '';
      let deleted = 0;
      const failed = [];
      for (const id of ids) {
        try {
          const response = await fetch(`/api/web/records/${id}`, { method: 'DELETE' });
          if (response.status === 401) { listError.textContent = 'Sessão expirada. Recarregue a página e entre novamente.'; return; }
          if (response.ok) {
            deleted++;
            if (editingId === id) resetForm();
          } else {
            failed.push(response.status === 404 ? `#${id} (não encontrada)` : `#${id}`);
          }
        } catch (_) { failed.push(`#${id}`); }
      }
      if (deleted) listMessage.textContent = `${deleted} tarefa(s) excluída(s).`;
      if (failed.length) listError.textContent = `Não foi possível excluir: ${failed.join(', ')}.`;
      await Promise.all([loadList(), loadDashboard()]);
    }
    async function loadTask(id) {
      taskError.textContent = '';
      taskMessage.textContent = '';
      try {
        const response = await fetch(`/api/web/records/${id}`);
        if (response.status === 401) { taskError.textContent = 'Sessão expirada. Recarregue a página e entre novamente.'; return; }
        if (response.status === 404) { taskError.textContent = `Tarefa #${id} não encontrada.`; return; }
        if (!response.ok) { taskError.textContent = 'Não foi possível carregar a tarefa.'; return; }
        const task = await response.json();
        showProblems({});
        fillTask(task);
        setMode(task.id);
      } catch (_) { taskError.textContent = 'Não foi possível conectar ao servidor.'; }
    }

    document.getElementById('load-task').addEventListener('submit', (event) => {
      event.preventDefault();
      loadTask(document.getElementById('load-id').value);
    });
    document.getElementById('task-cancel').addEventListener('click', () => {
      resetForm();
      taskMessage.textContent = '';
    });
    taskForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      taskError.textContent = '';
      taskMessage.textContent = '';
      const task = readTask();
      const problems = validate(task);
      showProblems(problems);
      if (Object.keys(problems).length) { taskError.textContent = 'Corrija os campos destacados.'; return; }
      try {
        const response = await fetch(editingId ? `/api/web/records/${editingId}` : '/api/web/records', {
          method: editingId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(task)
        });
        if (response.status === 422) {
          showProblems((await response.json()).errors);
          taskError.textContent = 'Corrija os campos destacados.';
          return;
        }
        if (response.status === 401) { taskError.textContent = 'Sessão expirada. Recarregue a página e entre novamente.'; return; }
        if (response.status === 404) { taskError.textContent = 'A tarefa não existe mais.'; return; }
        if (!response.ok) { taskError.textContent = 'Não foi possível salvar a tarefa.'; return; }
        const result = await response.json();
        taskMessage.textContent = editingId ? `Tarefa #${result.id} atualizada.` : `Tarefa #${result.id} cadastrada.`;
        resetForm();
        await Promise.all([loadList(), loadDashboard()]);
      } catch (_) { taskError.textContent = 'Não foi possível conectar ao servidor.'; }
    });

    const searchForm = document.getElementById('search-form');
    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      listState.filters = {
        title: document.getElementById('search-title').value.trim(),
        priority: document.getElementById('search-priority').value,
        status: document.getElementById('search-status').value
      };
      listState.page = 1;
      listMessage.textContent = '';
      loadList();
    });
    document.getElementById('clear-search').addEventListener('click', () => {
      searchForm.reset();
      listState.filters = null;
      listState.page = 1;
      listMessage.textContent = '';
      loadList();
    });
    for (const button of document.querySelectorAll('button.sort')) {
      button.addEventListener('click', () => {
        const column = button.dataset.sort;
        listState.order = listState.sort === column && listState.order === 'asc' ? 'desc' : 'asc';
        listState.sort = column;
        listState.page = 1;
        loadList();
      });
    }
    document.getElementById('prev-page').addEventListener('click', () => {
      if (listState.page > 1) { listState.page--; loadList(); }
    });
    document.getElementById('next-page').addEventListener('click', () => {
      if (listState.page < listState.totalPages) { listState.page++; loadList(); }
    });
    document.getElementById('select-all').addEventListener('change', (event) => {
      for (const box of document.querySelectorAll('#task-rows input[type="checkbox"]')) {
        if (box.checked !== event.target.checked) { box.checked = event.target.checked; box.dispatchEvent(new Event('change')); }
      }
    });
    document.getElementById('delete-selected').addEventListener('click', deleteSelected);

    // Exports every task of the active search (the last submitted filters) in the
    // current table order. No page is sent, so the file is never a single page.
    async function exportCSV() {
      listError.textContent = '';
      listMessage.textContent = '';
      const params = new URLSearchParams({ sort: listState.sort, order: listState.order });
      if (listState.filters) {
        for (const [key, value] of Object.entries(listState.filters)) if (value) params.set(key, value);
      }
      const button = document.getElementById('export-csv');
      button.disabled = true;
      try {
        const response = await fetch(`/api/web/records/export?${params}`);
        if (response.status === 401) { listError.textContent = 'Sessão expirada. Recarregue a página e entre novamente.'; return; }
        if (!response.ok) { listError.textContent = 'Não foi possível exportar as tarefas.'; return; }
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'tarefas.csv';
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        listMessage.textContent = listState.filters ? 'CSV exportado com os filtros ativos.' : 'CSV exportado com todas as tarefas.';
      } catch (_) {
        listError.textContent = 'Não foi possível conectar ao servidor.';
      } finally {
        button.disabled = false;
      }
    }
    document.getElementById('export-csv').addEventListener('click', exportCSV);

    showSession().catch(() => { error.textContent = 'Não foi possível conectar ao servidor.'; });
  </script>
</body>
</html>
